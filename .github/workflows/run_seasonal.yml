name: Run seasonal manual

"on":
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year"
        required: true
        default: "2022"
        type: string
      end_year:
        description: "End year"
        required: true
        default: "2025"
        type: string
      season_start:
        description: "Season start (MM-DD)"
        required: true
        default: "06-15"
        type: string
      season_end:
        description: "Season end (MM-DD)"
        required: true
        default: "09-30"
        type: string
      step_value:
        description: "Step value"
        required: true
        default: "4"
        type: string
      step_unit:
        description: "Step unit"
        required: true
        default: "days"
        type: choice
        options:
          - hours
          - days
          - weeks
      timezone:
        description: "IANA timezone"
        required: true
        default: "Indian/Mahe"
        type: string
      snapshot_local_hour:
        description: "Local snapshot hour"
        required: true
        default: "18"
        type: string
      grid:
        description: "Grid size (WxH)"
        required: true
        default: "220x220"
        type: string
      run_id:
        description: "Run id under docs/latest/runs"
        required: true
        default: "seasonal-manual"
        type: string
      publish_to_latest:
        description: "Commit docs/latest back to the selected branch"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: annual-seyd-yaar-seasonal
  cancel-in-progress: false

jobs:
  seasonal:
    runs-on: ubuntu-latest
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      SEYDYAAR_CMEMS_CACHE_DIR: backend/data/cache/copernicus
      PYTHONPATH: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Restore Copernicus subset cache
        uses: actions/cache@v4
        with:
          path: backend/data/cache/copernicus
          key: ${{ runner.os }}-cmems-${{ hashFiles('backend/requirements.txt', 'backend/config/datasets.json', 'backend/config/aoi.geojson', 'backend/config/species_profiles.json') }}
          restore-keys: |
            ${{ runner.os }}-cmems-

      - name: Install backend requirements
        run: pip install -r backend/requirements.txt

      - name: Validate Copernicus credentials
        run: |
          python - <<'PY'
          import copernicusmarine
          ok = copernicusmarine.login(check_credentials_valid=True)
          if not ok:
              raise SystemExit("Copernicus credentials validation failed")
          print("Copernicus credentials are valid.")
          PY

      - name: Run seasonal pipeline
        run: |
          python -m seydyaar run-seasonal \
            --start-year "${{ inputs.start_year }}" \
            --end-year "${{ inputs.end_year }}" \
            --season-start "${{ inputs.season_start }}" \
            --season-end "${{ inputs.season_end }}" \
            --step-value "${{ inputs.step_value }}" \
            --step-unit "${{ inputs.step_unit }}" \
            --timezone "${{ inputs.timezone }}" \
            --snapshot-local-hour "${{ inputs.snapshot_local_hour }}" \
            --grid "${{ inputs.grid }}" \
            --run-id "${{ inputs.run_id }}"

      - name: Upload latest bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: seasonal-latest-${{ inputs.run_id }}
          path: docs/latest
          if-no-files-found: error

      - name: Commit and push docs/latest
        if: ${{ inputs.publish_to_latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest
          if git diff --cached --quiet; then
            echo "No docs/latest changes to commit."
            exit 0
          fi
          git commit -m "seasonal run: ${{ inputs.run_id }}"
          git push origin "HEAD:${{ github.ref_name }}"
